<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NQ Softphone</title>
<style>
  :root { --bg:#fff; --fg:#1d2433; --muted:#6b7280; --line:#e5e7eb; --ok:#16a34a; --bad:#dc2626; --pri:#2563eb; }
  body { margin:0; font-family: system-ui, "Segoe UI", Tahoma, sans-serif; background:#f3f4f6; color:var(--fg); }
  #nq-phone { width: auto; max-width: 420px; margin: 16px; background:var(--bg); border:1px solid var(--line); border-radius:14px; padding:16px; box-shadow:0 4px 16px rgba(0,0,0,.06); }
  .row { display:flex; gap:8px; margin-bottom:10px; }
  input { flex:1; padding:9px 10px; border:1px solid var(--line); border-radius:8px; font-size:15px; direction:ltr; }
  button { padding:14px 12px; border:0; border-radius:8px; cursor:pointer; font-size:14px; color:#fff; background:var(--pri); }
  button.ok { background:var(--ok); } button.bad { background:var(--bad); } button.gray { background:#9ca3af; }
  button:disabled { opacity:.4; cursor:default; }
  #status { font-size:13px; color:var(--muted); margin-bottom:12px; }
  #status b.on { color:var(--ok); } #status b.off { color:var(--bad); }
  #callinfo { min-height:22px; font-weight:600; margin:6px 0 10px; direction:ltr; text-align:center; }
  #login, #dialer { display:none; }
  .lbl { display:block; font-size:12px; color:var(--muted); margin:0 2px 4px; }
  .full { width:100%; }
</style>
</head>
<body>

<div id="nq-phone">
  <div id="status">الحالة: <b class="off">غير متصل</b></div>
  <div id="err" style="color:var(--bad);font-size:13px;margin:-6px 0 10px"></div>

  <!-- تسجيل الدخول -->
  <div id="login">
    <div class="row"><input id="ext" placeholder="رقم التحويلة (مثلًا 101)"></div>
    <div class="row"><input id="pwd" type="password" placeholder="باسورد التحويلة"></div>
    <button class="full" onclick="NQPhone.login(ext.value.trim(), pwd.value)">دخول</button>
    <details id="srvBox" style="margin-top:14px">
      <summary style="cursor:pointer;color:var(--muted);font-size:14px">⚙ إعدادات السيرفر</summary>
      <div style="margin-top:10px">
        <label class="lbl">عنوان السيرفر</label>
        <div class="row"><input id="srvHost" placeholder="3.89.245.93.sslip.io"></div>
        <label class="lbl">البورت</label>
        <div class="row"><input id="srvPort" inputmode="numeric" placeholder="8089"></div>
        <label class="lbl">المسار</label>
        <div class="row"><input id="srvPath" placeholder="/ws"></div>
        <div class="row">
          <button class="gray" style="flex:1" onclick="NQSettings.reset()">الافتراضي</button>
          <button style="flex:1" onclick="NQSettings.save()">حفظ</button>
        </div>
        <div id="srvMsg" style="font-size:13px;color:var(--muted)"></div>
      </div>
    </details>
  </div>

  <!-- لوحة الاتصال -->
  <div id="dialer">
    <div id="callinfo"></div>
    <div class="row"><input id="num" placeholder="05XXXXXXXX"></div>
    <div class="row">
      <button id="btnCall" class="ok" onclick="NQPhone.call(num.value)">اتصال</button>
      <button id="btnAnswer" class="ok" onclick="NQPhone.answer()" disabled>رد</button>
      <button id="btnHang" class="bad" onclick="NQPhone.hangup()" disabled>إنهاء</button>
      <button id="btnMute" class="gray" onclick="NQPhone.toggleMute()" disabled>كتم</button>
      <button id="btnSpk" class="gray" onclick="NQPhone.toggleSpeaker()">سماعة</button>
    </div>
    <button class="gray full" onclick="NQPhone.logout()">خروج</button>
  </div>
</div>

<audio id="remoteAudio" autoplay></audio>
<audio id="ringtone"></audio>

<script src="jssip.min.js"></script>
<script>
/* =====================================================================
   NQ Softphone — تليفون WebRTC بسيط للتركيب جوه الـ CRM
   - بيتصل بسنترال FreePBX عن طريق WSS على بورت 8089
   - التسجيل بيحصل على السيرفر (Force Recording على التحويلات)
   - الـ CRM يقدر يستخدم:
       NQPhone.call("05XXXXXXXX")              اتصال بضغطة
       NQPhone.onIncoming = (num) => {...}      فتح ملف العميل عند الرنين
       NQPhone.onCallEnded = (info) => {...}    تسجيل المكالمة في الـ CRM
   ===================================================================== */
/* إعدادات السيرفر: الافتراضي هنا، والمستخدم يقدر يغيّرها من "⚙ إعدادات السيرفر" */
const DEFAULT_SERVER = { host: "3.89.245.93.sslip.io", port: "8089", path: "/ws" };
const CONFIG = { wss: [], domain: "", iceServers: [{ urls: "stun:stun.l.google.com:19302" }] };

const NQSettings = {
  load() {
    let s = {};
    try { s = JSON.parse(localStorage.getItem("nq_server") || "{}"); } catch (e) {}
    return { ...DEFAULT_SERVER, ...s };
  },
  apply(s) {
    const path = s.path.startsWith("/") ? s.path : "/" + s.path;
    CONFIG.domain = s.host;
    CONFIG.wss = [`wss://${s.host}${s.port && s.port !== "443" ? ":" + s.port : ""}${path}`];
    if (s.port !== "443") CONFIG.wss.push(`wss://${s.host}${path}`); // احتياطي على 443
    $("srvHost").value = s.host; $("srvPort").value = s.port; $("srvPath").value = path;
  },
  save() {
    const s = {
      host: $("srvHost").value.trim().replace(/^wss?:\/\//, "").replace(/\/.*$/, ""),
      port: $("srvPort").value.trim() || "443",
      path: $("srvPath").value.trim() || "/ws"
    };
    if (!s.host) { $("srvMsg").textContent = "اكتب عنوان السيرفر"; return; }
    try { localStorage.setItem("nq_server", JSON.stringify(s)); } catch (e) {}
    this.apply(s);
    $("srvMsg").textContent = "اتحفظ ✓ — اضغط دخول";
  },
  reset() {
    try { localStorage.removeItem("nq_server"); } catch (e) {}
    this.apply(DEFAULT_SERVER);
    $("srvMsg").textContent = "رجعت للإعدادات الافتراضية ✓";
  }
};

const $ = id => document.getElementById(id);

const NQPhone = {
  ua: null, session: null, muted: false, callStart: null, direction: null, peer: null,

  // أحداث يربطها الـ CRM
  onIncoming:  (number) => {},
  onAnswered:  (info) => {},
  onCallEnded: (info) => {},

  speaker: false,
  toggleSpeaker() {
    this.speaker = !this.speaker;
    $("btnSpk").textContent = this.speaker ? "سماعة: شغّالة" : "سماعة";
    if (window.Android) Android.setSpeaker(this.speaker);
  },

  login(ext, password) {
    if (!ext || !password) return this._err("اكتب رقم التحويلة والباسورد");
    if (typeof JsSIP === "undefined") return this._err("مكتبة الاتصال مش محمّلة");
    this._err("");
    $("status").innerHTML = 'الحالة: <b style="color:#d97706">جاري الاتصال بالسنترال…</b>';
    if (this.ua) { try { this.ua.stop(); } catch (e) {} }
    try { localStorage.setItem("nq_login", JSON.stringify({ ext, password })); } catch (e) {}
    const sockets = CONFIG.wss.map((u, i) => ({ socket: new JsSIP.WebSocketInterface(u), weight: 10 - i }));
    this.ua = new JsSIP.UA({
      sockets,
      connection_recovery_min_interval: 2,
      connection_recovery_max_interval: 30,
      uri: `sip:${ext}@${CONFIG.domain}`,
      password,
      display_name: ext,
      register: true,
      session_timers: false
    });
    this.ua.on("registered",        () => { this._status(true, ext); try { sessionStorage.setItem("nq_ext", ext); } catch(e){} });
    this.ua.on("unregistered",      () => this._status(false));
    this.ua.on("registrationFailed",e  => {
      this._status(false);
      this._err(e.cause === "Authentication Error" || e.cause === "Rejected"
        ? "رقم التحويلة أو الباسورد غلط" : "فشل الدخول: " + e.cause);
    });
    this.ua.on("disconnected",      () => { this._status(false); this._err("مش قادر يوصل للسنترال — بيحاول تاني…"); });
    this.ua.on("connected",         () => this._err(""));
    this.ua.on("newRTCSession",     e  => this._onSession(e));
    this.ua.start();
  },

  logout() {
    try { localStorage.removeItem("nq_login"); } catch (e) {}
    if (this.ua) this.ua.stop(); this.ua = null; this._status(false);
  },

  call(number) {
    number = String(number || "").replace(/[^\d+*#]/g, "");
    if (!this.ua || !this.ua.isRegistered()) return this._err("التليفون مش متصل");
    if (this.session) return this._err("في مكالمة شغالة");
    if (!number) return;
    if (window.Android) Android.onCallStateChanged(true);
    this.ua.call(`sip:${number}@${CONFIG.domain}`, {
      mediaConstraints: { audio: true, video: false },
      pcConfig: { iceServers: CONFIG.iceServers }
    });
  },

  answer() {
    if (!this.session) return;
    this._ring(false);
    this.session.answer({
      mediaConstraints: { audio: true, video: false },
      pcConfig: { iceServers: CONFIG.iceServers }
    });
  },

  hangup() { if (this.session) this.session.terminate(); },

  toggleMute() {
    if (!this.session) return;
    this.muted ? this.session.unmute({ audio: true }) : this.session.mute({ audio: true });
    this.muted = !this.muted;
    $("btnMute").textContent = this.muted ? "إلغاء الكتم" : "كتم";
  },

  /* ---------- داخلي ---------- */
  _onSession(e) {
    const s = e.session;
    if (this.session) { s.terminate({ status_code: 486 }); return; } // مشغول
    this.session = s;
    this.direction = e.originator === "remote" ? "in" : "out";
    this.peer = s.remote_identity.uri.user;
    this.callStart = null;

    if (this.direction === "in") {
      this._info("📞 مكالمة واردة من " + this.peer);
      this._ring(true);
      this._buttons({ call:false, answer:true, hang:true, mute:false });
      if (window.Android) Android.onIncoming(this.peer);
      this.onIncoming(this.peer);
    } else {
      this._info("جاري الاتصال بـ " + this.peer + "...");
      this._buttons({ call:false, answer:false, hang:true, mute:false });
    }

    s.on("peerconnection", ev => this._attachAudio(ev.peerconnection));
    if (s.connection) this._attachAudio(s.connection);

    s.on("accepted", () => {
      this.callStart = Date.now();
      this._ring(false);
      this._info("متصل: " + this.peer);
      this._buttons({ call:false, answer:false, hang:true, mute:true });
      if (window.Android) Android.onCallStateChanged(true);
      this.onAnswered({ number: this.peer, direction: this.direction });
    });
    const end = (ev) => {
      const info = {
        number: this.peer, direction: this.direction,
        answered: !!this.callStart,
        duration: this.callStart ? Math.round((Date.now() - this.callStart) / 1000) : 0,
        cause: ev && ev.cause
      };
      this._ring(false);
      this.session = null; this.muted = false;
      $("btnMute").textContent = "كتم";
      this._info(info.answered ? `انتهت المكالمة (${info.duration} ث)` : "المكالمة لم تكتمل: " + info.cause);
      this._buttons({ call:true, answer:false, hang:false, mute:false });
      if (window.Android) { Android.onCallStateChanged(false); Android.setSpeaker(false); }
      this.speaker = false; $("btnSpk").textContent = "سماعة";
      this.onCallEnded(info);
    };
    s.on("ended", end);
    s.on("failed", end);
  },

  _attachAudio(pc) {
    pc.addEventListener("track", ev => { $("remoteAudio").srcObject = ev.streams[0]; });
  },
  _ring(on) { const r = $("ringtone"); try { on ? r.play() : (r.pause(), r.currentTime = 0); } catch(e){} },
  _info(t) { $("callinfo").textContent = t; },
  _err(t) { $("err").textContent = t || ""; },
  _buttons(b) {
    $("btnCall").disabled = !b.call; $("btnAnswer").disabled = !b.answer;
    $("btnHang").disabled = !b.hang; $("btnMute").disabled = !b.mute;
  },
  _status(on, ext) {
    $("status").innerHTML = on ? `الحالة: <b class="on">متصل</b> — تحويلة ${ext}` : `الحالة: <b class="off">غير متصل</b>`;
    $("login").style.display  = on ? "none" : "block";
    $("dialer").style.display = on ? "block" : "none";
  }
};
window.NQPhone = NQPhone;
NQSettings.apply(NQSettings.load());
NQPhone._status(false);
// دخول تلقائي بآخر تحويلة اتسجّلت على الجهاز
try { const s = JSON.parse(localStorage.getItem("nq_login") || "null"); if (s) NQPhone.login(s.ext, s.password); } catch (e) {}
$("num").addEventListener("keydown", e => { if (e.key === "Enter") NQPhone.call(e.target.value); });

/* ===== مثال ربط بالـ CRM (عدّله حسب نظامكم) =====

  // افتح ملف العميل بالرقم
  // window.open("/crm/customers/search?phone=" + num, "_blank");
};
NQPhone.onCallEnded = (info) => {
  // سجّل المكالمة في الـ CRM
  // fetch("/api/calls", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(info) });
};
*/
</script>
</body>
</html>
