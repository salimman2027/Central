name: Windows app
on:
  push:
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Build installer
        working-directory: desktop
        run: |
          npm install --no-audit --no-fund
          npm run dist
      - uses: actions/upload-artifact@v4
        with: { name: nq-phone-windows, path: "desktop/dist/*.exe" }
      - name: Publish to release "latest"
        shell: bash
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          f=$(ls desktop/dist/*.exe | head -1)
          cp "$f" NQ-Phone-Setup.exe
          gh release upload latest NQ-Phone-Setup.exe --clobber -R ${{ github.repository }}
