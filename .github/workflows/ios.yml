name: iOS project
on:
  push:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: brew install xcodegen && cd ios && xcodegen
      - name: Build (simulator, unsigned) to verify it compiles
        run: |
          cd ios
          xcodebuild -project NQPhone.xcodeproj -scheme NQPhone -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build | tail -25
      - name: Package for developers
        run: |
          cd ios && rm -rf build DerivedData
          cd .. && zip -qr NQPhone-iOS.zip ios -x 'ios/build/*'
      - uses: actions/upload-artifact@v4
        with:
          name: NQPhone-iOS
          path: NQPhone-iOS.zip
