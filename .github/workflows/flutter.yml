name: Flutter app
on:
  push:
    paths: ["flutter/**", ".github/workflows/flutter.yml"]
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Setup project
        run: cd flutter && ./setup.sh
      - name: Analyze
        run: cd flutter && flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Build APK (debug-signed)
        run: cd flutter && flutter build apk --release
      - uses: actions/upload-artifact@v4
        with: { name: nq-phone-flutter-apk, path: flutter/build/app/outputs/flutter-apk/app-release.apk }
  ios:
    runs-on: macos-13
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Setup project
        run: cd flutter && ./setup.sh
      - name: Build iOS (no codesign) to verify it compiles
        run: cd flutter && flutter build ios --release --no-codesign
