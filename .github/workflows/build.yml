name: Build APK

on:
  push:
    paths: ["app/**", "build.gradle.kts", "settings.gradle.kts", "gradle.properties", ".github/workflows/build.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle :app:assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk NQPhone.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NQPhone-apk
          path: NQPhone.apk
      - name: Publish download link
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # منمسحش الـ release: فيه ملفات تانية (EXE، NQ Call) — بنستبدل الـ APK بس
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "NQ Phone (latest)" --notes "آخر النسخ" --latest
          gh release upload latest NQPhone.apk --clobber
