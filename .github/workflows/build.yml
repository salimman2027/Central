name: Build DocScanner APK

on:
  push:
    branches: [docscanner]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle :app:assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk DocScanner.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DocScanner-apk
          path: DocScanner.apk
      - name: Publish download link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete docscanner-latest --yes --cleanup-tag || true
          gh release create docscanner-latest DocScanner.apk --target docscanner --title "DocScanner (latest)" --notes "Build ${{ github.sha }}" --latest=false
