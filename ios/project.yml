name: NQPhone
options:
  bundleIdPrefix: sa.nq
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    DEVELOPMENT_TEAM: ""          # ← المبرمج يحط الـ Team ID هنا أو من Xcode
    CODE_SIGN_STYLE: Automatic
targets:
  NQPhone:
    type: application
    platform: iOS
    sources:
      - path: NQPhone
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sa.nq.phone
        PRODUCT_NAME: NQ Phone
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: NQPhone/Info.plist
        GENERATE_INFOPLIST_FILE: NO
